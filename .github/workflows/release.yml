name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry publishing (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI for the bot-created version PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$RELEASE_PR" | jq -er '.number')
          branch=$(gh pr view "$number" --json headRefName --jq '.headRefName')
          gh workflow run ci.yml --ref "$branch"

  publish:
    needs: release
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'push' && needs.release.outputs.created == 'true') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing release tag on main
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release metadata and npm OIDC support
        run: |
          node scripts/release-metadata.ts
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run demo
      - run: npm run format:check
      - run: npm run check:browser
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Build the release tarball once
        run: |
          mkdir -p release-artifacts
          npm pack --json --pack-destination release-artifacts > release-artifacts/pack.json
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("release-artifacts/pack.json"))[0]; fs.appendFileSync(process.env.GITHUB_ENV, `MR_ON_TARBALL=${process.cwd()}/release-artifacts/${p.filename}\n`)'
      - name: Test the exact tarball to be published
        run: npm run test:package
      - name: Ensure verification did not modify tracked files
        run: git diff --exit-code
      - name: Publish verified tarball through npm OIDC
        run: npm publish "$MR_ON_TARBALL" --access public --tag latest --ignore-scripts
